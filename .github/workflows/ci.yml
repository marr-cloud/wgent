name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet (windows)
        run: go vet ./...
      - name: Vet (linux, pure packages)
        shell: bash
        run: GOOS=linux go vet ./...
      - name: Test
        run: go test ./...
